name: XAU Real Dataset Smoke

on:
  pull_request:
    paths:
      - "src/modules/strategy/xau_v2_dataset.py"
      - "benchmarks/xau_v2_real_dataset_v1/**"
      - ".github/workflows/xau-real-dataset-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-biquote-dataset:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install network dependency
        run: python -m pip install --disable-pip-version-check httpx

      - name: Fetch and audit real Biquote XAUUSD dataset
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python benchmarks/xau_v2_real_dataset_v1/run.py | tee xau-real-dataset-smoke.json

      - name: Upload real dataset audit
        uses: actions/upload-artifact@v4
        with:
          name: xau-real-dataset-smoke-v1
          path: xau-real-dataset-smoke.json
