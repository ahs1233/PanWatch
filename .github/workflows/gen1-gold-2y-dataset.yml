name: GEN1 Gold 2Y Dataset Cache

on:
  push:
    branches:
      - "feat/ahmed-toolbox-xau"
    paths:
      - ".github/workflows/gen1-gold-2y-dataset.yml"
      - "benchmarks/gen1_gold_2y_real_v1/run.py"
      - "src/platform/marketdata/xau_dukascopy.py"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: gen1-gold-2y-dataset-v2
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  GEN1_2Y_START: "2024-09-23"
  GEN1_2Y_END: "2026-09-23"
  GEN1_2Y_DATASET_TAG: "gen1-xau-2y-dataset-v2-20240923-20260923"
  GEN1_2Y_SEED_RUN_ID: "35892854818"

jobs:
  ensure-release:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure persistent dataset release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GEN1_2Y_DATASET_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "dataset_release_exists=true"
          else
            gh release create "$GEN1_2Y_DATASET_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "GEN1 XAUUSD 2Y Frozen Dataset v2" \
              --notes "Persistent resumable research dataset. Source: Dukascopy XAUUSD BID/ASK M1 candles with tick-derived M1 fallback. Not a trading signal."
          fi

  seed-existing:
    needs: ensure-release
    runs-on: ubuntu-latest
    steps:
      - name: Seed already successful monthly artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/gen1-seed
          ASSET_LIST="$(gh release view "$GEN1_2Y_DATASET_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' || true)"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GEN1_2Y_SEED_RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | startswith("gen1-gold-2y-data-m")) | [.name] | @tsv' |
          while IFS=$'\t' read -r artifact_name; do
            [ -n "$artifact_name" ] || continue
            shard="$(printf '%s' "$artifact_name" | sed -E 's/^gen1-gold-2y-data-(m[0-9]{2})-.*/\1/')"
            asset="$shard.pkl.gz"
            if printf '%s\n' "$ASSET_LIST" | grep -qx "$asset"; then
              echo "seed_skip_existing=$asset"
              continue
            fi
            work="/tmp/gen1-seed/$shard"
            rm -rf "$work"
            mkdir -p "$work"
            if ! gh run download "$GEN1_2Y_SEED_RUN_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --name "$artifact_name" \
              --dir "$work"; then
              echo "seed_download_failed=$artifact_name"
              continue
            fi
            source_file="$(find "$work" -type f -name '*.pkl.gz' | head -n 1)"
            [ -n "$source_file" ] || continue
            cp "$source_file" "/tmp/gen1-seed/$asset"
            gh release upload "$GEN1_2Y_DATASET_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              "/tmp/gen1-seed/$asset" \
              --clobber
            echo "seeded_asset=$asset"
          done

  build-month:
    needs: seed-existing
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - shard: m01
            start: "2024-09-23"
            end: "2024-10-23"
          - shard: m02
            start: "2024-10-23"
            end: "2024-11-23"
          - shard: m03
            start: "2024-11-23"
            end: "2024-12-23"
          - shard: m04
            start: "2024-12-23"
            end: "2025-01-23"
          - shard: m05
            start: "2025-01-23"
            end: "2025-02-23"
          - shard: m06
            start: "2025-02-23"
            end: "2025-03-23"
          - shard: m07
            start: "2025-03-23"
            end: "2025-04-23"
          - shard: m08
            start: "2025-04-23"
            end: "2025-05-23"
          - shard: m09
            start: "2025-05-23"
            end: "2025-06-23"
          - shard: m10
            start: "2025-06-23"
            end: "2025-07-23"
          - shard: m11
            start: "2025-07-23"
            end: "2025-08-23"
          - shard: m12
            start: "2025-08-23"
            end: "2025-09-23"
          - shard: m13
            start: "2025-09-23"
            end: "2025-10-23"
          - shard: m14
            start: "2025-10-23"
            end: "2025-11-23"
          - shard: m15
            start: "2025-11-23"
            end: "2025-12-23"
          - shard: m16
            start: "2025-12-23"
            end: "2026-01-23"
          - shard: m17
            start: "2026-01-23"
            end: "2026-02-23"
          - shard: m18
            start: "2026-02-23"
            end: "2026-03-23"
          - shard: m19
            start: "2026-03-23"
            end: "2026-04-23"
          - shard: m20
            start: "2026-04-23"
            end: "2026-05-23"
          - shard: m21
            start: "2026-05-23"
            end: "2026-06-23"
          - shard: m22
            start: "2026-06-23"
            end: "2026-07-23"
          - shard: m23
            start: "2026-07-23"
            end: "2026-08-23"
          - shard: m24
            start: "2026-08-23"
            end: "2026-09-23"

    env:
      GEN1_2Y_DOWNLOAD_WORKERS: "2"

    steps:
      - name: Checkout exact dataset builder
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dataset dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check \
            httpx sqlalchemy pydantic pydantic-settings pyyaml openai \
            apscheduler websockets matplotlib
          python -m pip install --disable-pip-version-check -e ./packages/pan-agent-runtime
          python -m pip install --disable-pip-version-check -e ./packages/pan-agent-token-meter
          python -m pip install --disable-pip-version-check -e ./packages/pan-agent-tool-research

      - name: Restore latest month checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          mkdir -p existing gen1-data "gen1-day-cache/$SHARD"
          gh release download "$GEN1_2Y_DATASET_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$SHARD.pkl.gz" \
            --dir existing || true
          if [ -f "existing/$SHARD.pkl.gz" ]; then
            echo "resume_asset=existing/$SHARD.pkl.gz"
          else
            echo "resume_asset=none"
          fi

      - name: Build or resume month
        id: prepare
        env:
          SHARD: ${{ matrix.shard }}
          GEN1_2Y_PREPARE_ONLY: "1"
          GEN1_2Y_SHARD_START: ${{ matrix.start }}
          GEN1_2Y_SHARD_END: ${{ matrix.end }}
          GEN1_2Y_SHARD_OUT: gen1-data/${{ matrix.shard }}.pkl.gz
          GEN1_2Y_EXISTING_SHARD: existing/${{ matrix.shard }}.pkl.gz
          GEN1_2Y_DAY_CACHE_DIR: gen1-day-cache/${{ matrix.shard }}
        run: |
          set +e
          set -o pipefail
          python benchmarks/gen1_gold_2y_real_v1/run.py 2>&1 | tee "gen1-data-$SHARD.log"
          RC=${PIPESTATUS[0]}
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist complete or partial month to release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          test -s "gen1-data/$SHARD.pkl.gz"
          test -s "gen1-data/$SHARD.manifest.json"
          gh release upload "$GEN1_2Y_DATASET_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            "gen1-data/$SHARD.pkl.gz" \
            "gen1-data/$SHARD.manifest.json" \
            --clobber

      - name: Upload month diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gen1-dataset-${{ matrix.shard }}-${{ github.sha }}
          retention-days: 7
          path: |
            gen1-data/${{ matrix.shard }}.pkl.gz
            gen1-data/${{ matrix.shard }}.manifest.json
            gen1-data-${{ matrix.shard }}.log

      - name: Fail incomplete month after checkpoint persistence
        if: always()
        env:
          PREPARE_RC: ${{ steps.prepare.outputs.rc }}
        run: |
          if [ "${PREPARE_RC:-1}" != "0" ]; then
            echo "Month remains incomplete; partial checkpoint was persisted."
            exit 1
          fi

  assemble-manifest:
    needs: build-month
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact dataset builder
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install manifest dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            httpx sqlalchemy pydantic pydantic-settings pyyaml openai \
            apscheduler websockets matplotlib
          python -m pip install --disable-pip-version-check -e ./packages/pan-agent-runtime
          python -m pip install --disable-pip-version-check -e ./packages/pan-agent-token-meter
          python -m pip install --disable-pip-version-check -e ./packages/pan-agent-tool-research

      - name: Download all frozen month assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/gen1-2y-data
          gh release download "$GEN1_2Y_DATASET_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'm*.pkl.gz' \
            --pattern 'm*.manifest.json' \
            --dir /tmp/gen1-2y-data
          test "$(find /tmp/gen1-2y-data -maxdepth 1 -name 'm*.pkl.gz' | wc -l | tr -d ' ')" = "24"
          test "$(find /tmp/gen1-2y-data -maxdepth 1 -name 'm*.manifest.json' | wc -l | tr -d ' ')" = "24"

      - name: Build immutable dataset manifest
        env:
          GEN1_2Y_BUILD_MANIFEST: "1"
          GEN1_2Y_SHARD_GLOB: /tmp/gen1-2y-data/m*.pkl.gz
          GEN1_2Y_MANIFEST_OUT: /tmp/gen1-2y-data/dataset-manifest.json
        run: |
          python benchmarks/gen1_gold_2y_real_v1/run.py

      - name: Publish frozen manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GEN1_2Y_DATASET_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            /tmp/gen1-2y-data/dataset-manifest.json \
            --clobber

      - name: Upload manifest evidence
        uses: actions/upload-artifact@v4
        with:
          name: gen1-gold-2y-dataset-manifest-${{ github.sha }}
          retention-days: 30
          path: /tmp/gen1-2y-data/dataset-manifest.json
