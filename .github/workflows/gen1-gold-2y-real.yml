name: GEN1 Gold 2Y Real Backtest

on:
  push:
    branches:
      - "feat/ahmed-toolbox-xau"
    paths:
      - "benchmarks/gen1_gold_2y_real_v1/**"
      - ".github/workflows/gen1-gold-2y-real.yml"
      - "src/modules/xau/replay.py"
      - "src/modules/xau/cognition.py"
      - "src/modules/xau/evidence_fusion.py"
      - "src/modules/xau/market_context.py"
      - "src/modules/xau/service.py"
      - "src/modules/strategy/xau_intraday.py"
  pull_request:
    paths:
      - "benchmarks/gen1_gold_2y_real_v1/**"
      - ".github/workflows/gen1-gold-2y-real.yml"
      - "src/modules/xau/replay.py"
      - "src/modules/xau/cognition.py"
      - "src/modules/xau/evidence_fusion.py"
      - "src/modules/xau/market_context.py"
      - "src/modules/xau/service.py"
      - "src/modules/strategy/xau_intraday.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gen1-gold-2y-real-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}
  GEN1_2Y_START: "2024-09-23"
  GEN1_2Y_SPLIT: "2025-09-23"
  GEN1_2Y_END: "2026-09-23"
  GEN1_2Y_STEP_MINUTES: "5"
  GEN1_2Y_DOWNLOAD_WORKERS: "12"
  GEN1_2Y_OUT: "artifacts/gen1_gold_2y_real_v1"

jobs:
  prepare-data:
    name: prepare-data-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Monthly checkpoints keep retry scope small. Bound aggregate pressure on
      # the public Dukascopy feed to three concurrent shard jobs x four workers.
      GEN1_2Y_DOWNLOAD_WORKERS: "4"
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - shard: m01
            start: "2024-09-23"
            end: "2024-10-23"
          - shard: m02
            start: "2024-10-23"
            end: "2024-11-23"
          - shard: m03
            start: "2024-11-23"
            end: "2024-12-23"
          - shard: m04
            start: "2024-12-23"
            end: "2025-01-23"
          - shard: m05
            start: "2025-01-23"
            end: "2025-02-23"
          - shard: m06
            start: "2025-02-23"
            end: "2025-03-23"
          - shard: m07
            start: "2025-03-23"
            end: "2025-04-23"
          - shard: m08
            start: "2025-04-23"
            end: "2025-05-23"
          - shard: m09
            start: "2025-05-23"
            end: "2025-06-23"
          - shard: m10
            start: "2025-06-23"
            end: "2025-07-23"
          - shard: m11
            start: "2025-07-23"
            end: "2025-08-23"
          - shard: m12
            start: "2025-08-23"
            end: "2025-09-23"
          - shard: m13
            start: "2025-09-23"
            end: "2025-10-23"
          - shard: m14
            start: "2025-10-23"
            end: "2025-11-23"
          - shard: m15
            start: "2025-11-23"
            end: "2025-12-23"
          - shard: m16
            start: "2025-12-23"
            end: "2026-01-23"
          - shard: m17
            start: "2026-01-23"
            end: "2026-02-23"
          - shard: m18
            start: "2026-02-23"
            end: "2026-03-23"
          - shard: m19
            start: "2026-03-23"
            end: "2026-04-23"
          - shard: m20
            start: "2026-04-23"
            end: "2026-05-23"
          - shard: m21
            start: "2026-05-23"
            end: "2026-06-23"
          - shard: m22
            start: "2026-06-23"
            end: "2026-07-23"
          - shard: m23
            start: "2026-07-23"
            end: "2026-08-23"
          - shard: m24
            start: "2026-08-23"
            end: "2026-09-23"

    steps:
      - name: Checkout exact strategy revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact strategy revision
        env:
          EXPECTED_STRATEGY_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ACTUAL_STRATEGY_SHA="$(git rev-parse HEAD)"
          echo "expected_strategy_sha=$EXPECTED_STRATEGY_SHA"
          echo "actual_strategy_sha=$ACTUAL_STRATEGY_SHA"
          test "$ACTUAL_STRATEGY_SHA" = "$EXPECTED_STRATEGY_SHA"
          echo "STRATEGY_REVISION=$ACTUAL_STRATEGY_SHA" >> "$GITHUB_ENV"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install benchmark dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check \
            httpx sqlalchemy pydantic pydantic-settings pyyaml openai \
            apscheduler websockets matplotlib
          python -m pip install --disable-pip-version-check -e ./packages/pan-agent-runtime
          python -m pip install --disable-pip-version-check -e ./packages/pan-agent-token-meter
          python -m pip install --disable-pip-version-check -e ./packages/pan-agent-tool-research

      - name: Download and checkpoint dataset shard
        env:
          GEN1_2Y_PREPARE_ONLY: "1"
          GEN1_2Y_SHARD_START: ${{ matrix.start }}
          GEN1_2Y_SHARD_END: ${{ matrix.end }}
          GEN1_2Y_SHARD_OUT: gen1-data/${{ matrix.shard }}.pkl.gz
        run: |
          set -o pipefail
          python benchmarks/gen1_gold_2y_real_v1/run.py 2>&1 | tee gen1-data-${{ matrix.shard }}.log

      - name: Upload dataset shard
        uses: actions/upload-artifact@v4
        with:
          name: gen1-gold-2y-data-${{ matrix.shard }}-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 7
          path: |
            gen1-data/${{ matrix.shard }}.pkl.gz
            gen1-data-${{ matrix.shard }}.log

  two-year-real-backtest:
    needs: prepare-data
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GEN1_2Y_SHARD_GLOB: /tmp/gen1-2y-data/*.pkl.gz
      GEN1_2Y_PROFILE: "1"

    steps:
      - name: Checkout exact strategy revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact strategy revision
        env:
          EXPECTED_STRATEGY_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ACTUAL_STRATEGY_SHA="$(git rev-parse HEAD)"
          echo "expected_strategy_sha=$EXPECTED_STRATEGY_SHA"
          echo "actual_strategy_sha=$ACTUAL_STRATEGY_SHA"
          test "$ACTUAL_STRATEGY_SHA" = "$EXPECTED_STRATEGY_SHA"
          echo "STRATEGY_REVISION=$ACTUAL_STRATEGY_SHA" >> "$GITHUB_ENV"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install benchmark dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check \
            httpx sqlalchemy pydantic pydantic-settings pyyaml openai \
            apscheduler websockets matplotlib
          python -m pip install --disable-pip-version-check -e ./packages/pan-agent-runtime
          python -m pip install --disable-pip-version-check -e ./packages/pan-agent-token-meter
          python -m pip install --disable-pip-version-check -e ./packages/pan-agent-tool-research

      - name: Download prepared dataset shards
        uses: actions/download-artifact@v4
        with:
          pattern: gen1-gold-2y-data-*-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/gen1-2y-data
          merge-multiple: true

      - name: Run two-year real XAUUSD walk-forward benchmark
        run: |
          set -o pipefail
          echo '{"phase":"benchmark_start","strategy_revision":"'${STRATEGY_REVISION}'","started_at":"'$(date -u +%FT%TZ)'"}' | tee gen1-gold-2y-progress.jsonl
          python benchmarks/gen1_gold_2y_real_v1/run.py 2>&1 | tee gen1-gold-2y-console.json
          echo '{"phase":"benchmark_complete","strategy_revision":"'${STRATEGY_REVISION}'","completed_at":"'$(date -u +%FT%TZ)'"}' | tee -a gen1-gold-2y-progress.jsonl

      - name: Upload report, episode tables and charts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gen1-gold-2y-real-v1-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 30
          path: |
            artifacts/gen1_gold_2y_real_v1/**
            gen1-gold-2y-console.json
            gen1-gold-2y-progress.jsonl
