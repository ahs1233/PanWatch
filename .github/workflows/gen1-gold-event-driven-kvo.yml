name: GEN1 Gold KVO Event-Driven 2Y Backtest

on:
  push:
    branches:
      - "feat/ahmed-toolbox-xau"
    paths:
      - ".github/workflows/gen1-gold-event-driven-kvo.yml"
      - "benchmarks/gen1_gold_event_driven_kvo_v1/**"
      - "src/modules/strategy/xau_kvo.py"
      - "ci_tests/test_xau_kvo.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gen1-gold-event-driven-kvo-\${{ github.ref_name }}
  cancel-in-progress: true

env:
  PYTHONPATH: "."
  GEN1_2Y_START: "2024-09-23"
  GEN1_2Y_SPLIT: "2025-09-23"
  GEN1_2Y_END: "2026-09-23"
  GEN1_EVENT_STEP_MINUTES: "5"
  GEN1_KVO_OUT: "artifacts/gen1_gold_event_driven_kvo_v1"
  GEN1_2Y_DATASET_TAG: "gen1-xau-2y-dataset-v2-20240923-20260923"

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: pytest -q ci_tests/test_xau_kvo.py

  kvo-event-driven-two-year-backtest:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GEN1_2Y_SHARD_GLOB: /tmp/gen1-2y-data/m*.pkl.gz
      GEN1_2Y_MANIFEST: /tmp/gen1-2y-data/dataset-manifest.json
    steps:
      - name: Checkout exact strategy revision
        uses: actions/checkout@v4

      - name: Verify exact strategy revision
        run: |
          ACTUAL_STRATEGY_SHA="$(git rev-parse HEAD)"
          echo "actual_strategy_sha=$ACTUAL_STRATEGY_SHA"
          echo "STRATEGY_REVISION=$ACTUAL_STRATEGY_SHA" >> "$GITHUB_ENV"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install benchmark dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check \
            httpx sqlalchemy pydantic pydantic-settings pyyaml openai \
            apscheduler websockets matplotlib
          python -m pip install --disable-pip-version-check -e ./packages/pan-agent-runtime
          python -m pip install --disable-pip-version-check -e ./packages/pan-agent-token-meter
          python -m pip install --disable-pip-version-check -e ./packages/pan-agent-tool-research

      - name: Download frozen two-year dataset
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/gen1-2y-data
          gh release view "$GEN1_2Y_DATASET_TAG" >/dev/null
          gh release download "$GEN1_2Y_DATASET_TAG" \
            --pattern 'm*.pkl.gz' \
            --pattern 'dataset-manifest.json' \
            --dir /tmp/gen1-2y-data
          SHARD_COUNT="$(find /tmp/gen1-2y-data -maxdepth 1 -name 'm*.pkl.gz' | wc -l | tr -d ' ')"
          test "$SHARD_COUNT" = "24"
          test -s /tmp/gen1-2y-data/dataset-manifest.json

      - name: Run KVO event-driven two-year backtest
        run: |
          set -o pipefail
          python benchmarks/gen1_gold_event_driven_kvo_v1/run.py 2>&1 | tee gen1-gold-kvo-event-driven-console.json

      - name: Upload KVO event-driven report and trades
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gen1-gold-event-driven-kvo-v1-\${{ github.sha }}
          retention-days: 30
          path: |
            artifacts/gen1_gold_event_driven_kvo_v1/**
            gen1-gold-kvo-event-driven-console.json
