name: GTG Deep Experience v1

on:
  push:
    branches:
      - "feat/ahmed-toolbox-xau"
    paths:
      - ".github/workflows/gtg-experience-v1.yml"
      - "benchmarks/gtg_experience_v1/**"
      - "src/modules/xau/gtg_experience.py"
      - "docs/GTG_EXPERIENCE_V1.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gtg-experience-v1-${{ github.ref_name }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}
  GTG_EXP_START: "2024-09-23"
  GTG_EXP_TRAIN_END: "2025-07-23"
  GTG_EXP_VALID_END: "2025-09-23"
  GTG_EXP_TEST_END: "2026-09-23"
  GTG_EXP_OUT: "artifacts/gtg_experience_v1"
  GEN1_2Y_DATASET_TAG: "gen1-xau-2y-dataset-v2-20240923-20260923"
  GEN1_2Y_SHARD_GLOB: "/tmp/gtg-exp-data/m*.pkl.gz"

jobs:
  train-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact GTG revision
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install base dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check numpy httpx sqlalchemy pydantic pydantic-settings pyyaml openai apscheduler websockets

      - name: Install PyTorch CPU
        run: |
          python -m pip install --disable-pip-version-check torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check -e ./packages/pan-agent-runtime
          python -m pip install --disable-pip-version-check -e ./packages/pan-agent-token-meter
          python -m pip install --disable-pip-version-check -e ./packages/pan-agent-tool-research

      - name: Download frozen two-year GTG dataset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/gtg-exp-data
          gh release download "$GEN1_2Y_DATASET_TAG" --pattern 'm*.pkl.gz' --dir /tmp/gtg-exp-data
          test "$(find /tmp/gtg-exp-data -maxdepth 1 -name 'm*.pkl.gz' | wc -l | tr -d ' ')" = "24"

      - name: Compile GTG experience code
        run: |
          python -m py_compile src/modules/xau/gtg_experience.py benchmarks/gtg_experience_v1/run.py

      - name: Train first year and evaluate untouched second year
        run: |
          set -o pipefail
          python benchmarks/gtg_experience_v1/run.py 2>&1 | tee gtg-experience-console.json

      - name: Upload GTG experience evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gtg-experience-v1-${{ github.sha }}
          retention-days: 30
          path: |
            artifacts/gtg_experience_v1/**
            gtg-experience-console.json
